name: Publish to Artifact Registry

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v2.20.0

env:
  PROJECT_ID: clinware-brain-development
  REGION: us-central1
  REPOSITORY: quarkus-extensions

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ARTIFACT_PUBLISHER_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Maven for Artifact Registry
        run: |
          # Create settings.xml with Artifact Registry credentials
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>artifact-registry</id>
                <configuration>
                  <httpConfiguration>
                    <get>
                      <usePreemptive>true</usePreemptive>
                    </get>
                    <head>
                      <usePreemptive>true</usePreemptive>
                    </head>
                    <put>
                      <params>
                        <property>
                          <name>http.protocol.expect-continue</name>
                          <value>false</value>
                        </property>
                      </params>
                    </put>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION}"

      - name: Set project version
        run: |
          mvn versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build and publish to Artifact Registry
        run: |
          # Build only the modules needed for Vertex AI
          mvn clean deploy -DskipTests \
            -pl bom,common/runtime,common/deployment,vertx-ai/runtime,vertx-ai/deployment \
            -am \
            -DaltDeploymentRepository=artifact-registry::default::artifactregistry://us-central1-maven.pkg.dev/clinware-brain-development/quarkus-extensions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Summary
        run: |
          echo "## Published Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ steps.version.outputs.VERSION }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-services-bom\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-vertex-ai\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-vertex-ai-deployment\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-common\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-common-deployment\`" >> $GITHUB_STEP_SUMMARY

