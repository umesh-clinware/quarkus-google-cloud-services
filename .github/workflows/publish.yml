name: Publish to Artifact Registry

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v2.20.0
  workflow_dispatch:  # Allow manual trigger

env:
  PROJECT_ID: clinware-brain-development
  REGION: us-central1
  REPOSITORY: quarkus-extensions

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ARTIFACT_PUBLISHER_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authentication
        run: |
          echo "Authenticated as:"
          gcloud auth list
          echo "Project: ${{ env.PROJECT_ID }}"

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="2.20.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION}"

      - name: Set project version
        run: |
          mvn versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build and deploy BOM first
        run: |
          # Build BOM standalone (it has quarkiverse-parent, can build independently)
          echo "Building and deploying BOM..."
          cd bom
          mvn versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false
          mvn clean deploy -DskipTests \
            -DaltDeploymentRepository=artifact-registry::default::artifactregistry://${{ env.REGION }}-maven.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}
          cd ..
      
      - name: Build and deploy remaining modules
        run: |
          # Now build other modules from root (BOM is already in local .m2 and Artifact Registry)
          echo "Building and deploying remaining modules..."
          mvn clean deploy -DskipTests \
            -pl common/runtime,common/deployment,vertx-ai/runtime,vertx-ai/deployment \
            -am \
            -DaltDeploymentRepository=artifact-registry::default::artifactregistry://${{ env.REGION }}-maven.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}

      - name: Summary
        if: always()
        run: |
          echo "## Published Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ steps.version.outputs.VERSION }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-services-bom\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-vertex-ai\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-vertex-ai-deployment\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-common\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`io.quarkiverse.googlecloudservices:quarkus-google-cloud-common-deployment\`" >> $GITHUB_STEP_SUMMARY
